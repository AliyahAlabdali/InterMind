[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-ai-interviewer"
version = "0.1.0"
description = "InterMind: an adaptive AI interviewer that turns a job description into role-specific coverage targets, conducts the interview as a LangGraph loop, and produces an evidence-based report"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.50",
    "scikit-learn>=1.4",
    "langgraph>=1.2",
    # Used at runtime by the Azure Speech token service. It was previously only a dev
    # dependency and happened to be present transitively via `openai`; depending on that was
    # luck, not design.
    "httpx>=0.27",
    # Persistence. PostgreSQL via SQLAlchemy 2.0's async ORM and asyncpg; Alembic owns the
    # schema. Recruiter accounts and everything they own must survive a restart, which nothing
    # in the in-memory repositories could do.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Azure Speech authentication. Production authenticates with the App Service managed
    # identity, so this is required rather than optional: it used to be an `azure` extra, but
    # the deployment installs the project plainly and an uninstalled extra turned the only
    # production credential path into a 500. The synchronous credential is the one used - see
    # app.services.speech_token.EntraTokenProvider - so azure-core's aiohttp extra is not needed.
    "azure-identity>=1.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]
# Retained so documented `pip install -e ".[azure]"` commands keep working. azure-identity is
# now a plain runtime dependency, so this extra adds nothing.
azure = [
    "azure-identity>=1.17",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks have their own style conventions (long print/markdown lines for readability) and
# aren't part of the app package; lint app/ and tests/ instead.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; they are generated artefacts, not hand-maintained source, and
# reflowing them by hand would be undone by the next autogenerate.
"alembic/versions/*" = ["E501"]
# FastAPI's dependency-injection pattern relies on `Depends(...)` in defaults.
"app/api/**" = ["B008"]
