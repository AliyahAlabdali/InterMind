# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - intermind-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r backend/requirements.txt
                
      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment.
      #
      # `path: backend/` makes that directory the artifact root, so the deployed wwwroot
      # contains `app/`, `data/`, `alembic/`, `requirements.txt` and `alembic.ini` at its top
      # level. That is load-bearing in three ways, so it must not be changed back to `.`:
      #   - Oryx looks for requirements.txt at the wwwroot root and only then falls back to
      #     pyproject.toml, which it hands to Poetry; this project is setuptools-only, so the
      #     Poetry path installs nothing and the app dies with ModuleNotFoundError.
      #   - The App Service startup command is `python -m uvicorn app.main:app`, which resolves
      #     `app` from the wwwroot root.
      #   - app/core/config.py derives the O*NET knowledge-base path from the package location,
      #     so backend/data must ship beside backend/app or every interview-plan request 500s.
      # It also keeps frontend/, docs/ and notebooks/ out of the Python deployment, and antenv/
      # is created at the repository root, so it falls outside the artifact with no exclusion.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend/

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService
      

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_262D166DC80E4E99B840B127C966CF6C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C68404401FF84984A2E07E4585325603 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6B88C3E92FB9437BB5F475D78A796BC1 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'intermind-api'
          slot-name: 'Production'
          